<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE 1599 starter player</title>
  <style>
    body { font: 1rem system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    form, .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 1rem 0; }
    #document { flex: 1 1 20rem; }
    #controls { display: flex; gap: .25rem; }
    [role="alert"] { color: #a00000; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1 id="title">IEEE 1599 starter player</h1>
  <p id="authors"></p>
  <form id="open">
    <label for="document">IEEE 1599 document</label>
    <input id="document" name="document" value="materials/piece.xml" required>
    <button>Open</button>
  </form>
  <p id="status" role="alert"></p>
  <section id="player" hidden aria-label="Player">
    <div class="toolbar">
      <label for="recording">Recording</label>
      <select id="recording"></select>
      <div id="controls"></div>
    </div>
    <div class="toolbar">
      <button id="previous" type="button">Previous page</button>
      <output id="page" aria-label="Score page"></output>
      <button id="next" type="button">Next page</button>
    </div>
    <div id="score"></div>
    <p>Now: <output id="now" aria-label="Current score event"></output></p>
  </section>
  <script type="module" src="main.js"></script>
</body>
</html>
