<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE 1599 example</title>
  <style>
    body { font: 1rem system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    #controls { display: flex; margin: 1rem 0; }
    [role="alert"] { color: #a00000; }
  </style>
</head>
<body>
  <h1>IEEE 1599 example</h1>
  <p>This synthetic score and recording demonstrate the validated IEEE 1599 document model, buffered audio and score-event seeking.</p>
  <button id="initialize">Initialize audio</button>
  <p id="message" role="alert"></p>
  <div id="controls"></div>
  <div id="score"></div>
  <p>Now: <output id="now" aria-label="Current score event"></output></p>
  <section aria-labelledby="model-heading">
    <h2 id="model-heading">Document model</h2>
    <p id="validation"></p>
    <ol id="events" aria-label="Spine events"></ol>
  </section>
  <script type="module" src="main.js"></script>
</body>
</html>
