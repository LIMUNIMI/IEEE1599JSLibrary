name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run types:check
      - run: pnpm run docs:build
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY_ENABLED != 'true'
        with:
          name: documentation-site
          path: _site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY_ENABLED == 'true'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy

  browser-tests:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps ${{ matrix.browser }}
      - run: pnpm run test:browser:matrix
        env:
          BROWSER: ${{ matrix.browser }}
          CAPABILITY_OUTPUT: ${{ runner.temp }}/browser-capabilities-${{ matrix.browser }}.json
      - run: pnpm run test:browser
        if: matrix.browser == 'chromium'
        env:
          BROWSER: chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-capabilities-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser-capabilities-${{ matrix.browser }}.json
          if-no-files-found: warn
